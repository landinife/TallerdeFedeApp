<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16191D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TallerdeFedeApp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: una columna de trabajo (máx. 720px) con encabezado fijo arriba y tres pestañas abajo, pensada para usar con el pulgar. */
:root{
  --bg:#ECEEED; --surface:#FFFFFF; --sunken:#E2E5E4; --fg:#16191D; --muted:#525961; --line:#CFD4D3;
  --accent:#E8590C; --on-accent:#FFFFFF; --danger:#B3261E; --warn:#8A5A00;
  --e-presupuestado:#6B7480; --e-confirmado:#1F6FD0; --e-terminado:#B7791F; --e-entregado:#7B4FC4; --e-cobrado:#1F8A55; --e-facturado:#0E8589;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow','Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1E2226; --sunken:#262B30; --fg:#ECEEED; --muted:#A3ABB3; --line:#394047;
  --danger:#F2857D; --warn:#E5B45A;
  --e-presupuestado:#9AA3AD; --e-confirmado:#6AA6F0; --e-terminado:#E0A94A; --e-entregado:#B093EA; --e-cobrado:#5CC08D; --e-facturado:#4CC3C6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1E2226; --sunken:#262B30; --fg:#ECEEED; --muted:#A3ABB3; --line:#394047;
  --danger:#F2857D; --warn:#E5B45A;
  --e-presupuestado:#9AA3AD; --e-confirmado:#6AA6F0; --e-terminado:#E0A94A; --e-entregado:#B093EA; --e-cobrado:#5CC08D; --e-facturado:#4CC3C6; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.brand small{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:3px;line-height:1}
.brand b{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.5px;line-height:1}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:13px;font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
textarea{resize:vertical;min-height:66px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex-shrink:0}
input[type=color]{padding:3px;width:56px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
@media (max-width:460px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} }
.row{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.row-top{display:flex;gap:8px;align-items:flex-start}
.row-top>*:first-child{flex:1;min-width:0}
.out{min-height:44px;display:flex;align-items:center;justify-content:flex-end;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{min-height:46px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:44px;padding:8px 12px;font-size:15px}
.cli .btn.sm{white-space:nowrap;flex:0 0 auto}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btns .btn{flex:1 1 140px}
.ico{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sum{display:flex;flex-direction:column;gap:6px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .big{font-family:var(--display);font-weight:700;font-size:28px;border-top:2px solid var(--accent);padding-top:8px;margin-top:4px}
.hint{font-size:13.5px;color:var(--muted)}
.warn{color:var(--warn);font-weight:500}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{min-height:40px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:500}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){ .kpis{grid-template-columns:1fr} }
.kpi{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
details.job{background:var(--surface);border-radius:14px}
details.job>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
details.job>summary::-webkit-details-marker{display:none}
.job-l1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.job-l1 b{font-size:17px;min-width:0;overflow-wrap:anywhere}
.job-l1 span{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.job-l2{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.estado{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--fg)}
.job-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.items{display:flex;flex-direction:column;gap:6px;font-size:15px}
.items div{display:flex;justify-content:space-between;gap:12px}
.items div span:first-child{min-width:0;overflow-wrap:anywhere}
.items div span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{min-height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--fg);border-top-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal-h{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.modal-h h1{flex:1;font-size:24px}
.modal-b{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--sunken)}
.acts{max-width:720px;margin:0 auto;padding:0 16px 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.acts .btn{padding:8px 6px;line-height:1.15}
.sheet{display:flex;flex-direction:column;gap:16px}
.adj-t{width:100%;max-width:720px;font-weight:600;border-top:1px solid var(--line);padding-top:12px;overflow-wrap:anywhere}
.modal-b img,.sheet img{width:100%;max-width:720px;height:auto;background:#FFFFFF;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.modal-b canvas,.sheet canvas{width:100%;max-width:720px;height:auto;background:#FFFFFF;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;margin:0 auto;max-width:520px;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;text-align:center}
.bars{display:grid;gap:4px;height:150px}
.bar{display:flex;flex-direction:column;height:100%;min-width:0;border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted)}
.bw{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch}
.bv{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;color:var(--fg);line-height:1.4;overflow:visible}
.bf{display:block;border-radius:4px 4px 0 0;opacity:.6}
.bar.on .bf{opacity:1}
.bl{font-size:12.5px;border-top:1px solid var(--line);padding-top:4px;text-align:center}
.bar.on .bl{color:var(--fg);font-weight:600}
.hbar{height:14px;background:var(--sunken);border-radius:4px;overflow:hidden}
.hbar span{display:block;height:100%;border-radius:4px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line);cursor:pointer}
.cli{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.cli div{min-width:0;overflow-wrap:anywhere}
.cli small{color:var(--muted);display:block}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:14px;width:100%}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <span id="brandMark"></span>
  <div class="brand"><small>TALLER DE</small><b id="brandName">FEDERICO</b></div>
  <button class="ico" id="btnCfg" data-act="tab" data-v="cfg" aria-label="Configuración"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.55 5.25L10.87 2.47L13.13 2.47L13.45 5.25L15.74 6.20L17.94 4.46L19.54 6.06L17.80 8.26L18.75 10.55L21.53 10.87L21.53 13.13L18.75 13.45L17.80 15.74L19.54 17.94L17.94 19.54L15.74 17.80L13.45 18.75L13.13 21.53L10.87 21.53L10.55 18.75L8.26 17.80L6.06 19.54L4.46 17.94L6.20 15.74L5.25 13.45L2.47 13.13L2.47 10.87L5.25 10.55L6.20 8.26L4.46 6.06L6.06 4.46L8.26 6.20Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<div class="acts" id="acts" hidden></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Secciones"><div class="tabs-in">
  <button class="tab" data-act="tab" data-v="cot"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"></path></svg>Cotizador</button>
  <button class="tab" data-act="tab" data-v="pre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"></path><path d="M14 3v4h4M10 12h5M10 16h5"></path></svg>Presupuesto</button>
  <button class="tab" data-act="tab" data-v="his"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>Historial</button>
  <button class="tab" data-act="tab" data-v="met"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 20v-7M12 20V5M17 20v-10"></path></svg>Métricas</button>
</div></nav>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalT">
  <div class="modal-h"><h1 id="modalT">Vista previa</h1><button class="btn sm" data-act="modal-close">Volver</button></div>
  <div class="modal-b" id="modalB"></div>
  <div class="modal-f">
    <div class="btns"><button class="btn pri" data-act="pdf-share">Compartir por WhatsApp</button><button class="btn" data-act="pdf-down">Descargar PDF</button></div>
    
  </div>
</div>
<div class="modal" id="login" hidden role="dialog" aria-modal="true" aria-labelledby="loginT">
  <div class="modal-b" style="justify-content:center;background:var(--bg)">
    <span id="loginMark"></span>
    <h1 id="loginT" style="text-align:center">Taller de Federico</h1>
    <div class="hint" id="loginMsg" style="text-align:center;max-width:320px">Comprobando la sesión…</div>
    <button class="btn pri" id="loginBtn" data-act="login" hidden>Entrar con Google</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
'use strict';
/* ============ Utilidades ============ */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (v, n) => String(parseInt(String(v).replace(/\D/g, ''), 10) || 0).padStart(n, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function parseNum(v) {
  let s = String(v == null ? '' : v).replace(/[\s$]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const numStr = n => (n ? String(n).replace('.', ',') : '');
const money = n => '$ ' + (Number(n) || 0).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const qty = n => (Number(n) || 0).toLocaleString('es-AR', {maximumFractionDigits: 2});
function fechaLarga(iso) { const p = String(iso || today()).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'}); }
function fechaCorta(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function diasDesde(iso) { const p = String(iso || '').split('-').map(Number); if (p.length !== 3) return 999; return Math.floor((Date.now() - new Date(p[0], p[1] - 1, p[2]).getTime()) / 864e5); }
function hexRgb(h) { const m = /^#?([0-9a-f]{6})$/i.exec(h || ''); const n = parseInt(m ? m[1] : 'E8590C', 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function onColor(h) { const c = hexRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); const L = .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; return L > .32 ? '#16191D' : '#FFFFFF'; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 4200); }
function armed(btn) { if (btn.dataset.armed) return true; btn.dataset.armed = '1'; const txt = btn.textContent; btn.textContent = '¿Seguro? Tocá otra vez'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = txt; } }, 3500); return false; }

/* ============ Logo (una sola geometría para la app, el icono y el PDF) ============ */
const MARK = (() => {
  const gear = [], n = 12, pit = 360 / n;
  for (let i = 0; i < n; i++) [[72, -.27], [92, -.14], [92, .14], [72, .27]].forEach(q => { const t = (-90 + (i + q[1]) * pit) * Math.PI / 180; gear.push([100 + q[0] * Math.cos(t), 100 + q[0] * Math.sin(t)]); });
  return {gear, boreR: 30, key: [[93, 62], [107, 62], [107, 76], [93, 76]], ringR: 47, ringW: 7};
})();
function markSVG(size, color) {
  const P = pts => 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L') + 'Z', r = MARK.boreR;
  const d = P(MARK.gear) + 'M' + (100 - r) + ' 100A' + r + ' ' + r + ' 0 1 0 ' + (100 + r) + ' 100A' + r + ' ' + r + ' 0 1 0 ' + (100 - r) + ' 100Z' + P(MARK.key);
  return '<svg viewBox="0 0 200 200" width="' + size + '" height="' + size + '" aria-hidden="true" style="display:block;color:' + color + '"><path d="' + d + '" fill="currentColor" fill-rule="evenodd"></path><circle cx="100" cy="100" r="' + MARK.ringR + '" fill="none" stroke="var(--accent)" stroke-width="' + MARK.ringW + '"></circle></svg>';
}

/* ============ Datos ============ */
const ESTADOS = [['presupuestado', 'Presupuestado'], ['confirmado', 'Confirmado'], ['terminado', 'Terminado'], ['entregado', 'Entregado'], ['cobrado', 'Cobrado']];
const eIdx = e => ESTADOS.findIndex(x => x[0] === e);
const eName = e => (ESTADOS[eIdx(e)] || ESTADOS[0])[1];
const CFG0 = {accent: '#E8590C', dolar: 0, dolarFecha: '', razon: 'Taller de Federico', leyenda: 'Tornería y fresado', cuit: '', tel: '', dir: '', firmante: '', saludo: 'Por medio de la presente lo saludamos cordialmente y le hacemos llegar nuestra propuesta', pv: 2, prox: 1, ivaPct: '21', hh: 0, hhMoneda: 'ARS'};
const S = {cfg: Object.assign({}, CFG0), clientes: [], cotizaciones: [], trabajos: []};
const D = {cot: null, cli: null, ui: {v: 'cot', q: '', filtro: 'todos', open: {}, xlsx: null}};
let db = null;
const LS = 'tallerdefede_v1';
function saveLocal() { try { localStorage.setItem(LS, JSON.stringify({S, cot: D.cot})); } catch (e) {} }
function loadLocal() {
  try {
    const o = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!o) return;
    Object.assign(S.cfg, o.S.cfg || {});
    S.clientes = o.S.clientes || []; S.cotizaciones = o.S.cotizaciones || []; S.trabajos = o.S.trabajos || []; S.syncUid = o.S.syncUid || '';
    D.cot = (o.cot && o.cot.cliente && o.cot.extras) ? o.cot : null;
  } catch (e) {}
}
const clone = o => JSON.parse(JSON.stringify(o));
async function persist(kind, id, remove) {
  saveLocal();
  if (!db) return;
  try {
    if (kind === 'cfg') await db.doc('ajustes/config').set(clone(S.cfg));
    else if (kind === 'clientes') await db.doc('ajustes/clientes').set({lista: clone(S.clientes)});
    else if (remove) await db.doc(kind + '/' + id).delete();
    else { const o = S[kind].find(x => x.id === id); if (o) await db.doc(kind + '/' + id).set(clone(o)); }
  } catch (e) { toast('Quedó guardado en este dispositivo, pero no se pudo guardar en la nube.'); }
}

    try {
      const wb = window.XLSX.read(new Uint8Array(fr.result), {type: 'array'});

      if (!rows.length) return toast('La planilla está vacía.');

      const find = re => h.findIndex(c => re.test(c));
      let ci = {razon: find(/raz|nombre|cliente|empresa/), cuit: find(/cuit|cuil|dni/), tel: find(/tel|cel|whats|contacto/), dir: find(/dir|domic/)}, data = rows.slice(1);
      if (ci.razon < 0) { ci = {razon: 0, cuit: 1, tel: 2, dir: 3}; data = rows; }
      const get = (r, i) => (i >= 0 && r[i] != null) ? String(r[i]).trim() : '';
      D.ui.xlsx = data.map(r => ({razon: get(r, ci.razon), cuit: get(r, ci.cuit), tel: get(r, ci.tel), dir: get(r, ci.dir)})).filter(r => r.razon);
      if (!D.ui.xlsx.length) { D.ui.xlsx = null; return toast('No se encontraron clientes en la planilla.'); }
      render();
    } catch (e) { toast('No se pudo leer el archivo. Tiene que ser un Excel (.xlsx).'); }

      if (!o || !o.cfg || !Array.isArray(o.trabajos)) throw 0;
      const viejos = S.trabajos.map(t => t.id), viejasC = S.cotizaciones.map(t => t.id);
      S.cfg = Object.assign({}, CFG0, o.cfg); S.clientes = o.clientes || []; S.trabajos = o.trabajos; S.cotizaciones = o.cotizaciones || [];
      applyBrand(); render(); toast('Copia restaurada.');
      await persist('cfg'); await persist('clientes');
      for (const id of viejos) if (!S.trabajos.some(t => t.id === id)) await persist('trabajos', id, true);
      for (const id of viejasC) if (!S.cotizaciones.some(t => t.id === id)) await persist('cotizaciones', id, true);
      for (const t of S.trabajos) await persist('trabajos', t.id);
      for (const c of S.cotizaciones) await persist('cotizaciones', c.id);
    } catch (e) { toast('Ese archivo no es una copia de seguridad de esta app.'); }
  };
  fr.readAsText(file);
}
const ACT = {

  'del-row': b => { D.cot[b.dataset.k].splice(+b.dataset.i, 1); render(); saveLocal(); },
  'cot-new': b => { if (!cotVacia(D.cot) && !armed(b)) return; D.cot = newCot(); render(); window.scrollTo(0, 0); saveLocal(); },
  'cot-save': () => { saveCot(false); },
  'adj-del': b => { const a = D.cot.adj.splice(+b.dataset.i, 1)[0]; D.ui.skipAsk = false; render(); saveLocal(); if (a) adjBorrar(a); },
  'met-vista': b => { D.ui.metVista = b.dataset.v; render(); },
  'ask-save': () => { saveCot(false); },
  'ask-no': () => { D.ui.skipAsk = true; render(); },
  'met-modo': b => { D.ui.metModo = b.dataset.v; render(); },
  'met-n': b => { D.ui.metN = +b.dataset.v; D.ui.metPick = null; render(); },
  'met-pick': b => { D.ui.metPick = {k: b.dataset.k, i: +b.dataset.i}; render(); },
  'pre-share': async () => { const t = saveCot(true); if (t) await outPdf(t, true); },
  'pre-down': async () => { const t = saveCot(true); if (t) await outPdf(t, false); },
  'cli-from-cot': () => { if (upsertCliente(D.cot.cliente)) { persist('clientes'); toast('Cliente guardado.'); render(); } else toast('Escribí primero el nombre del cliente.'); },
  'modal-close': () => { $('#modal').hidden = true; PV = null; },
  'pdf-share': () => { if (PV) outPdf(PV.job, true); },
  'pdf-down': () => { if (PV) outPdf(PV.job, false); },
  'his-filter': b => { D.ui.filtro = b.dataset.e; render(); },
  'his-pdf': b => { const t = S.trabajos.find(x => x.id === b.dataset.id); if (t) openPreview(t); },
  'his-edit': b => { const t = S.trabajos.find(x => x.id === b.dataset.id); if (t) { D.cot = draftFromJob(t); D.ui.v = 'cot'; render(); window.scrollTo(0, 0); saveLocal(); } },
  'his-dup': b => { const t = S.trabajos.find(x => x.id === b.dataset.id); if (t) { D.cot = Object.assign(draftFromJob(t), {id: null, pv: pad(S.cfg.pv, 4), num: pad(S.cfg.prox, 6), fecha: today()}); D.ui.v = 'cot'; render(); window.scrollTo(0, 0); toast('Copia lista con número nuevo. Revisala y guardala.'); } },
  'his-del': b => { if (!armed(b)) return; const viejo = S.trabajos.find(x => x.id === b.dataset.id); S.trabajos = S.trabajos.filter(x => x.id !== b.dataset.id); if (D.cot.id === b.dataset.id) D.cot.id = null; persist('trabajos', b.dataset.id, true); render(); ((viejo && viejo.adj) || []).forEach(a => adjBorrar(a)); },
  'accent': b => { S.cfg.accent = b.dataset.h; applyBrand(); persist('cfg'); render(); },
  'xlsx-ok': () => { let n = 0; D.ui.xlsx.forEach(r => { if (upsertCliente(r)) n++; }); D.ui.xlsx = null; persist('clientes'); render(); toast('Se importaron ' + n + ' clientes.'); },
  'xlsx-no': () => { D.ui.xlsx = null; render(); },
  'cli-add': () => { D.cli = {id: null, razon: '', cuit: '', tel: '', dir: ''}; render(); },
  'cli-edit': b => { const k = S.clientes.find(x => x.id === b.dataset.id); if (k) { D.cli = clone(k); render(); const e = $('#i-cli-razon'); if (e) e.focus(); } },
  'cli-ok': () => { if (!upsertCliente(D.cli)) return toast('Falta el nombre del cliente.'); D.cli = null; persist('clientes'); render(); },
  'cli-no': () => { D.cli = null; render(); },
  'cli-del': b => { if (!armedIco(b)) return; S.clientes = S.clientes.filter(x => x.id !== b.dataset.id); persist('clientes'); render(); },
  'login': () => {
    const pr = new window.firebase.auth.GoogleAuthProvider(), au = window.firebase.auth();
    $('#loginMsg').textContent = 'Abriendo Google…';
    au.signInWithPopup(pr).catch(e => {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return au.signInWithRedirect(pr);
      $('#loginMsg').textContent = (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) ? 'Entrá con tu cuenta de Google para ver y resguardar tus presupuestos.' : 'No se pudo iniciar sesión (' + ((e && e.code) || 'error') + ').';
    });
  },
  'logout': async b => {
    if (!armed(b)) return;
    try { await window.firebase.auth().signOut(); } catch (e) {}
    resetLocal(); inv = null; acceso = []; D.ui.v = 'cot';
    try { localStorage.removeItem(LS); localStorage.removeItem('tdf_ws'); } catch (e) {}
    boot2();
  },
  'ws-comp': async () => { if (!inv) return; try { localStorage.setItem('tdf_ws', 'compartido:' + inv.ownerUid); } catch (e) {} await openWs(inv.ownerUid, true); },
  'ws-propio': async () => { try { localStorage.removeItem('tdf_ws'); } catch (e) {} await openWs(fbUser.uid, false); },
  'acc-add': async () => {
    const em = String(D.ui.accEmail || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return toast('Escribí un correo válido.');
    if (em === String(fbUser.email || '').toLowerCase()) return toast('Ese es tu propio correo.');
    if (acceso.includes(em)) return toast('Ese correo ya tiene acceso.');
    try {
      const lista = acceso.concat([em]);
      await fsdb.doc('accesos/' + fbUser.uid).set({emails: lista});
      await fsdb.doc('invitaciones/' + em).set({ownerUid: fbUser.uid, ownerEmail: String(fbUser.email || '').toLowerCase()});
      acceso = lista; D.ui.accEmail = ''; render(); toast('Listo: ' + em + ' ya puede ver este taller.');
    } catch (e) { toast('No se pudo dar acceso. Revisá que las reglas nuevas estén publicadas en Firebase.'); }
  },
  'acc-del': async b => {
    if (!armedIco(b)) return;
    const em = b.dataset.e, lista = acceso.filter(x => x !== em);
    try { await fsdb.doc('accesos/' + fbUser.uid).set({emails: lista}); acceso = lista; try { await fsdb.doc('invitaciones/' + em).delete(); } catch (e) {} render(); toast('Se quitó el acceso de ' + em + '.'); }
    catch (e) { toast('No se pudo quitar el acceso.'); }
  },
  'sync': async () => { toast((await syncRemote(ws && ws.uid, !!ws && !ws.compartido)) ? 'Datos sincronizados.' : 'No se pudo sincronizar. Revisá la conexión.'); },
  'app-share': async () => {
    const url = location.origin + location.pathname;
    try { if (navigator.share) { await navigator.share({title: 'TallerdeFedeApp', text: 'App de presupuestos de ' + (S.cfg.razon || 'Taller de Federico'), url}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); toast('Enlace copiado: pegalo en WhatsApp o donde quieras.'); } catch (e) { toast('Enlace de la app: ' + url); }
  },
  'backup': async () => { await saveFile('TallerdeFedeApp copia ' + today() + '.json', new Blob([JSON.stringify({cfg: S.cfg, clientes: S.clientes, trabajos: S.trabajos, cotizaciones: S.cotizaciones}, null, 1)], {type: 'application/json'})); }
};
function armedIco(b) { if (b.dataset.armed) return true; b.dataset.armed = '1'; b.style.color = 'var(--danger)'; b.style.borderColor = 'var(--danger)'; toast('Tocá otra vez el tacho para eliminar.'); setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.style.color = ''; b.style.borderColor = ''; } }, 3500); return false; }
function setPath(path, val) {
  const p = path.split('.'); let o = p[0] === 'cfg' ? S.cfg : D[p[0]];
  for (let i = 1; i < p.length - 1; i++) o = o[p[i]];
  o[p[p.length - 1]] = val;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b); });
document.addEventListener('toggle', e => { const d = e.target; if (d.classList && d.classList.contains('job')) D.ui.open[d.dataset.id] = d.open; }, true);
document.addEventListener('input', e => {
  const el = e.target, m = el.dataset.m; if (!m) return;
  const root = m.split('.')[0];
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (m === 'cfg.dolar' || m === 'cfg.hh') v = parseNum(v);
  if (m === 'cfg.pv' || m === 'cfg.prox') v = parseInt(String(v).replace(/\D/g, ''), 10) || (m === 'cfg.pv' ? 0 : 1);
  setPath(m, v);
  if (root === 'cot') recalcCot();
  else if (m === 'ui.q') { const l = $('#hisList'); if (l) l.innerHTML = hisList(); }
  else if (m === 'cfg.accent' || m === 'cfg.razon') applyBrand();
  if (root === 'cot') { D.ui.skipAsk = false; saveLocal(); }
});
document.addEventListener('change', e => {
  const el = e.target, m = el.dataset.m;
  if (el.id === 'fileXlsx' && el.files[0]) return readXlsx(el.files[0]);
  if (el.id === 'fileBackup' && el.files[0]) return readBackup(el.files[0]);
  if (el.id === 'fileAdj' && el.files.length) {
    const fs = Array.from(el.files); el.value = '';
    (async () => {
      for (const f of fs) {
        if (!/pdf|jpeg|png/i.test(f.type) && !/\.(pdf|jpe?g|png)$/i.test(f.name)) { toast('“' + f.name + '” no es un PDF ni una foto JPG o PNG.'); continue; }
        if (f.size > ADJ_MAX && /pdf/i.test(f.type + f.name)) { toast('“' + f.name + '” pesa más de 8 MB. Probá con una versión más liviana.'); continue; }
        toast('Guardando “' + f.name + '”…');
        try { D.cot.adj.push(await adjGuardar(f)); D.ui.skipAsk = false; saveLocal(); if (D.ui.v === 'cot') render(); toast('Plano adjuntado.'); }
        catch (e) { toast('No se pudo guardar “' + f.name + '”. Revisá la conexión.'); }
      }
    })();
    return;
  }
  if (el.dataset.chg === 'cliMet' || el.dataset.chg === 'cliPer') { D.ui[el.dataset.chg] = el.value; return render(); }
  if (el.dataset.chg === 'filtro') { D.ui.filtro = el.value; const l = $('#hisList'); if (l) l.innerHTML = hisList(); return; }
  if (el.dataset.chg === 'cliSel') { const k = S.clientes.find(c => c.id === el.value); if (k) { D.cot.cliente = {razon: k.razon, cuit: k.cuit, tel: k.tel, dir: k.dir}; D.ui.skipAsk = false; render(); saveLocal(); } return; }
  if (el.dataset.chg) {
    const t = S.trabajos.find(x => x.id === el.dataset.id); if (!t) return;
    if (el.dataset.chg === 'estado') { t.estado = el.value; t.hist = (t.hist || []).concat([{e: el.value, f: today()}]); if (eIdx(t.estado) < 2) t.facturado = false; }
    else { t.facturado = el.checked; t.facturadoF = el.checked ? today() : ''; }
    D.ui.open[t.id] = true; persist('trabajos', t.id); render(); return;
  }
  if (!m) return;
  if (m.indexOf('cfg.') === 0) { persist('cfg'); if ((m === 'cfg.hh' || m === 'cfg.hhMoneda') && cotVacia(D.cot)) D.cot = newCot(); if (m === 'cfg.dolar' || m === 'cfg.dolarFecha' || m === 'cfg.pv' || m === 'cfg.prox') { if (m === 'cfg.dolar' && !S.cfg.dolarFecha) S.cfg.dolarFecha = today(); render(); } return; }
  if (m === 'cot.iva' || m === 'cot.ivaPct') return render();
  if (m === 'cot.cliente.razon') { const k = S.clientes.find(c => c.razon.trim().toLowerCase() === el.value.trim().toLowerCase()); if (k) { D.cot.cliente = {razon: k.razon, cuit: k.cuit, tel: k.tel, dir: k.dir}; render(); saveLocal(); } }
  if (m === 'cot.pv') { D.cot.pv = pad(el.value, 4); el.value = D.cot.pv; }
  if (m === 'cot.num') { D.cot.num = pad(el.value, 6); el.value = D.cot.num; }
});
function boot2() { if (!D.cot) D.cot = newCot(); if (!D.cot.adj) D.cot.adj = []; applyBrand(); render(); }
loadLocal(); boot2(); connectDb();
